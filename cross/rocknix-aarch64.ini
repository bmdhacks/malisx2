# SPDX-License-Identifier: MIT
#
# ROCKNIX arm64 cross build (RK3566/RK3568 devices such as the RG DS Plus,
# with ROCKNIX's mali_kbase module loaded instead of panfrost), against the
# sysroot of a ROCKNIX build tree. Where that tree is comes from a machine
# file of your own, outside this repository, passed first:
#
#   # ~/rocknix-toolchain.ini
#   [constants]
#   toolchain = '/path/to/distribution/build.ROCKNIX-RK3566.aarch64/toolchain'
#
#   meson setup build-rocknix \
#       --cross-file ~/rocknix-toolchain.ini --cross-file cross/rocknix-aarch64.ini \
#       --native-file ~/rocknix-toolchain.ini --native-file cross/rocknix-native.ini
#
# The C and C++ compilers are the build machine's clang and lld, pointed at
# the ROCKNIX sysroot and its GCC runtime: a ROCKNIX toolchain downloaded
# from CI keeps its build machine's paths in the gcc wrappers and the
# binutils' RUNPATH, so its own gcc does not run anywhere else.
#
# A downloaded tree also keeps absolute CI paths in the sysroot's library
# symlinks (usr/lib/libdrm.so.2 -> /home/runner/...); they have to be made
# relative before the libraries can be linked.
#
# Requirements on the build machine:
#   - a ROCKNIX build tree for the device (make RK3566), its toolchain
#     directory named as `toolchain` above; its rustc carries the
#     aarch64-rocknix-linux-gnu target and also serves as the native rustc
#     (cross/rocknix-native.ini);
#   - clang and ld.lld;
#   - bindgen >= 0.71.1, not 0.72.0/0.73.0/0.73.1 (Mesa's rule), and a
#     libclang for it (with libclang 22, 0.71.x emits opaque structs and
#     the layout checks fail to compile: use 0.72.1);
#   - meson >= 1.7, ninja, Python 3 with mako and PyYAML.

[constants]
triple = 'aarch64-rocknix-linux-gnu'
sysroot = toolchain / triple / 'sysroot'
target_args = ['--target=' + triple, '--sysroot=' + sysroot,
               '--gcc-install-dir=' + toolchain / 'lib/gcc' / triple / '16.2.0']

[binaries]
c = ['clang'] + target_args
cpp = ['clang++'] + target_args
c_ld = 'lld'
cpp_ld = 'lld'
ar = toolchain / 'bin/llvm-ar'
strip = toolchain / 'bin/llvm-strip'
rust = [toolchain / 'bin/rustc', '--target', triple,
        '-C', 'linker=clang', '-C', 'link-arg=-fuse-ld=lld',
        '-C', 'link-arg=--target=' + triple,
        '-C', 'link-arg=--sysroot=' + sysroot,
        '-C', 'link-arg=--gcc-install-dir=' + toolchain / 'lib/gcc' / triple / '16.2.0']
# The build machine's pkg-config, reading the sysroot's .pc files (the
# Linux WSI needs libdrm, libudev and gbm); the toolchain's own is built
# for its CI machine's paths.
pkg-config = 'pkg-config'

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot / 'usr/lib/pkgconfig', sysroot / 'usr/share/pkgconfig']
# bindgen runs libclang directly, which does not know the sysroot. meson
# adds --target itself.
bindgen_clang_arguments = ['--sysroot=' + sysroot]

[built-in options]
c_args = ['-mcpu=cortex-a55']
cpp_args = ['-mcpu=cortex-a55']

[host_machine]
system = 'linux'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a55'
endian = 'little'
