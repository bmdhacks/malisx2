# SPDX-License-Identifier: MIT
#
# Build-machine half of the ROCKNIX cross build (cross/rocknix-aarch64.ini):
# the toolchain's rustc builds the proc-macro crates kraid needs, for
# machines without a rustc of their own. `toolchain` comes from the same
# machine file of your own, passed first as a native file too.

[binaries]
rust = [toolchain / 'bin/rustc']
